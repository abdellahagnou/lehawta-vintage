  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B0E15;
      color: #E6F0FF;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00D4FF, #D2A85D);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 60px;
    }
    .section h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #00D4FF;
      display: inline-block;
    }
    .section.premium h2 {
      border-bottom-color: #D2A85D;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }
    .card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,255,0.6);
      box-shadow: 0 10px 30px rgba(0,212,255,0.1);
    }
    .premium .card {
      border-color: rgba(210,168,93,0.3);
    }
    .premium .card:hover {
      border-color: rgba(210,168,93,0.8);
      box-shadow: 0 10px 30px rgba(210,168,93,0.15);
    }
    .card-label {
      font-size: 0.85rem;
      color: #6B7A89;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-preview {
      background: #1A1F2E;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
    }
    .card-preview svg {
      max-width: 100%;
      height: auto;
    }
    .card-link {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 6px;
      color: #00D4FF;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .card-link:hover {
      background: rgba(0,212,255,0.2);
      border-color: rgba(0,212,255,0.6);
    }
    .premium .card-link {
      background: rgba(210,168,93,0.1);
      border-color: rgba(210,168,93,0.3);
      color: #D2A85D;
    }
    .premium .card-link:hover {

      border-color: rgba(210,168,93,0.6);
