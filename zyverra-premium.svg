<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zyverra AI premium logo">
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#F7D98E"/>
      <stop offset="1" stop-color="#D2A85D"/>
    </linearGradient>
  </defs>

  <!-- dark background panel (transparent by default) -->
  <rect x="0" y="0" width="420" height="120" fill="none" />

  <!-- monogram badge -->
  <g transform="translate(18,10)">
    <rect x="0" y="0" width="84" height="84" rx="14" fill="#0F0C0A" stroke="url(#gold)" stroke-width="1" />
    <path d="M22 62 C30 52, 50 50, 62 42 C54 36, 42 34, 34 28" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="url(#gold)" font-weight="700">Z</text>
  </g>

  <!-- elegant wordmark -->
  <g transform="translate(120,72)">
    <text x="0" y="-6" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#D2A85D">Zyverra</text>
    <text x="200" y="-6" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#D2A85D" opacity="0.9">AI</text>
  </g>

  <!-- baseline -->
  <g transform="translate(120,92)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#A58C5A">Agency • Strategy • Automation</text>
  </g>
</svg>