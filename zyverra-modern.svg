<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zyverra AI modern logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#002" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- icon -->
  <g transform="translate(18,28)">
    <circle cx="30" cy="30" r="30" fill="url(#g1)" filter="url(#s)" />
    <path d="M18 22 L30 22 L30 26 L24 26 L36 44 L24 44 L24 40 L30 40 L30 36 L18 36 Z" fill="#fff" transform="translate(0,0) scale(1.25)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(90,72)">
    <text x="0" y="-6" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-weight="700" font-size="36" fill="#0B1A2B">Zyverra</text>
    <text x="220" y="-6" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#0072FF">AI</text>
  </g>

  <!-- subline -->
  <g transform="translate(90,90)">
    <text x="0" y="0" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7A89">Intelligent product design & automation</text>
  </g>
</svg>